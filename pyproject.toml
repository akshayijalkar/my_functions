[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptfunctions"
version = "0.1.0"
description = "A collection of reusable Python utility functions"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Akshay Ijalkar" }
]

[project.urls]
Homepage = "https://github.com/akshayijalkar/my_functions"
Repository = "https://github.com/akshayijalkar/my_functions"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
